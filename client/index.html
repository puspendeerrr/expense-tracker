<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/SplitMoney only logo.svg" />
    <link rel="apple-touch-icon" href="/SplitMoney only logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090B" />
    <!-- viewport-fit=cover exposes the safe-area insets; zoom is left enabled because
         blocking it fails WCAG 1.4.4 and breaks the app for low-vision users. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SplitMoney — Smart Expense Sharing &amp; Group Settlement</title>
    <meta name="description" content="SplitMoney shared expense management platform and real-time financial ledger for groups and flatmates." />
    
    <!-- OpenGraph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SplitMoney" />
    <meta property="og:title" content="SplitMoney — Smart Expense Sharing &amp; Group Settlement" />
    <meta property="og:description" content="Split expenses, track balances with flatmates down to the single paisa, and settle instantly with UPI." />
    <meta property="og:image" content="/SplitMoney Logo With Text.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SplitMoney — Smart Expense Sharing &amp; Group Settlement" />
    <meta name="twitter:description" content="Split expenses, track balances with flatmates down to the single paisa, and settle instantly with UPI." />
    <meta name="twitter:image" content="/SplitMoney Logo With Text.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <!-- Colours come from the base layer (bg-background / text-foreground) so the theme
       can switch them. Hardcoding bg-slate-50 here would win as a utility class and
       pin the page to light for ever. -->
  <body class="min-h-screen font-sans antialiased selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
