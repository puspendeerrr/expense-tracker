<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Expense Tracker — SplitWise</title>
    <meta name="description" content="Track shared group expenses, split bills, and manage balances with flatmates and friends." />
    <meta name="keywords" content="splitwise, expense tracker, shared expenses, group expenses, split bills" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Expense Tracker — SplitWise" />
    <meta property="og:description" content="Track shared group expenses, split bills, and manage balances with flatmates and friends." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Expense Tracker — SplitWise" />
    <meta name="twitter:description" content="Track shared group expenses, split bills, and manage balances with flatmates and friends." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Google Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SplitWise",
        "operatingSystem": "Web, Android",
        "applicationCategory": "FinanceApplication",
        "description": "Shared expense tracker for roommates, hostel students, PG flatmates, and families.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        },
        "author": {
          "@type": "Organization",
          "name": "Algorithyum"
        }
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
