services:
  postgres:
    image: postgres:17-alpine
    container_name: splitmoney-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitmoney
      POSTGRES_PASSWORD: splitmoney
      POSTGRES_DB: splitmoney
    ports:
      - "5434:5432"
    volumes:
      - splitmoney-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitmoney -d splitmoney"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  splitmoney-pgdata:
