services:
  postgres:
    image: postgres:17-alpine
    container_name: splitmoney-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitmoney
      POSTGRES_PASSWORD: splitmoney
      POSTGRES_DB: splitmoney
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitmoney -d splitmoney"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Pinned to an explicit name.
  #
  # Compose otherwise derives the volume name from the project directory and this
  # key, so renaming either one silently mounts a NEW, EMPTY volume -- Postgres
  # initialises a fresh database and every existing row appears to have vanished.
  # The old volume is still on disk, but nothing is reading it.
  #
  # This name must not change. It is what the live data is already stored under.
  pgdata:
    name: splitwise_splitwise-pgdata
