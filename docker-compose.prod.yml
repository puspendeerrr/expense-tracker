# SplitWise — the whole stack on one EC2 instance.
#
#   caddy     TLS termination and reverse proxy. Obtains and renews a real
#             certificate from Let's Encrypt on its own, given a domain name.
#   app       The API plus the built frontend, on one origin.
#   postgres  The database, on a named volume so it survives rebuilds.
#
# Start it with:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports. The app and the database are reachable only from
# inside the Docker network, so nothing but 80 and 443 is exposed to the
# internet even if the EC2 security group were misconfigured.

services:
  postgres:
    image: postgres:17-alpine
    container_name: splitwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-splitwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-splitwise}
    volumes:
      - splitwise-pgdata:/var/lib/postgresql/data
      # Backups written here are visible on the host, so they can be copied off
      # the instance. A backup that only exists inside the container is not one.
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-splitwise} -d ${POSTGRES_DB:-splitwise}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Vite inlines these at build time, so they belong here rather than in
      # `environment`. Setting them there would have no effect on the bundle.
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-SplitWise}
        # Empty means "same origin", which is correct here: the API and the SPA
        # are served by this same container behind the same domain.
        VITE_API_BASE_URL: ''
        VITE_SOCKET_URL: ''
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
        VITE_CLOUDINARY_FOLDER: ${VITE_CLOUDINARY_FOLDER:-splitwise}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    container_name: splitwise-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000

      # `postgres` is the service name above; Docker's internal DNS resolves it.
      DATABASE_URL: postgres://${POSTGRES_USER:-splitwise}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-splitwise}

      # The public address of the app. Same origin for the SPA and the API, so
      # this is one value and the server refuses to boot without it.
      CLIENT_ORIGINS: https://${DOMAIN:?DOMAIN is required}

      # Same-site, because the SPA and the API share an origin. This is the
      # setting that avoids Safari's third-party cookie blocking entirely.
      COOKIE_SAMESITE: lax

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?OTP_HASH_SECRET is required}

      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-SplitWise <onboarding@resend.dev>}

      CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
      CLOUDINARY_FOLDER: ${VITE_CLOUDINARY_FOLDER:-splitwise}

      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    # No `ports:` on purpose. Caddy reaches it over the Docker network; the
    # internet cannot reach it directly at all.
    expose:
      - '5000'

  caddy:
    image: caddy:2-alpine
    container_name: splitwise-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live on a volume so a restart does not re-request them and
      # run into Let's Encrypt's rate limits.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  splitwise-pgdata:
  caddy-data:
  caddy-config:
